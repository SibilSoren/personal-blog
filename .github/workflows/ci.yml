name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the build so a type error is reported as a type error
      # rather than as a build failure further down.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The site's whole premise is that the links on it work. This is what
      # caught three dead project links and eleven dead links in the README.
      - name: Check outbound links resolve
        run: node scripts/check-links.mjs
